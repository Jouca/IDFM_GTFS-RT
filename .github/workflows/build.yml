name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A new push to the same PR/branch supersedes the previous run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25 (the runtime of the Docker image)
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin' # same JDK as the Docker image (eclipse-temurin:25)
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and test
        run: mvn -B verify
